    <script>
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          function ViteSafeWebSocket(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite') !== -1))) {
              var target = new EventTarget();
              target.readyState = 1;
              target.OPEN = 1;
              target.CLOSED = 3;
              target.CLOSING = 2;
              target.CONNECTING = 0;
              target.url = url;
              target.protocol = 'vite-hmr';
              target.send = function() {};
              target.close = function() {};
              setTimeout(function() {
                try {
                  target.dispatchEvent(new Event('open'));
                } catch(e) {}
              }, 0);
              return target;
            }
            return new NativeWebSocket(url, protocols);
          }
          ViteSafeWebSocket.prototype = NativeWebSocket.prototype;
          ViteSafeWebSocket.CONNECTING = 0;
          ViteSafeWebSocket.OPEN = 1;
          ViteSafeWebSocket.CLOSING = 2;
          ViteSafeWebSocket.CLOSED = 3;
          window.WebSocket = ViteSafeWebSocket;
        }

        var origError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(a) { return (a && a.message) || String(a); }).join(' ');
          if (str.indexOf('WebSocket') !== -1 && (str.indexOf('closed without opened') !== -1 || str.indexOf('[vite]') !== -1)) {
            return;
          }
          return origError.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (typeof msg === 'string' && (msg.indexOf('WebSocket closed without opened') !== -1 || msg.indexOf('@vite/client') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var msg = (e && e.reason && (e.reason.message || String(e.reason))) || '';
          if (typeof msg === 'string' && (msg.indexOf('WebSocket closed without opened') !== -1 || msg.indexOf('@vite/client') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
